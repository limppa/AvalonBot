<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bat swarm (lightweight) — demo</title>
<style>
  @font-face { font-family: 'OptimusPrinceps';
    src: url('fonts/OptimusPrincepsSemiBold.ttf') format('truetype'); font-display: swap; }
  :root { --evil-red: #a82040; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08070a;
    font-family: 'OptimusPrinceps', Georgia, serif; }

  #board { position: fixed; inset: 0; display: grid; place-items: center;
    color: #1c1c24; font-size: 4vw; letter-spacing: .3em; user-select: none; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #wash { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,0,8,.35), rgba(0,0,0,.9)); opacity: 0; }

  .bat { position: absolute; left: 50%; top: 50%; width: 96px; height: 72px;
    will-change: transform, opacity; }
  .bat-svg { display: block; width: 100%; height: 100%; transform-origin: center;
    animation: flap var(--flap, .16s) infinite ease-in-out; }
  @keyframes flap { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.34); } }

  #reveal { position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; pointer-events: none; }
  #reveal .title { font-size: clamp(2.4rem, 9vw, 8rem); letter-spacing: .16em;
    text-transform: uppercase; color: var(--evil-red);
    text-shadow: 0 0 26px rgba(168,32,64,.45), 0 0 6px rgba(0,0,0,.9);
    opacity: 0; transform: scale(1.15); filter: blur(6px); }

  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 16px; align-items: center;
    font-family: system-ui, sans-serif; color: #999; font-size: 13px; }
  #controls button { font: inherit; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #333; background: #16161a; color: #ddd; cursor: pointer; }
  #controls label { display: flex; gap: 6px; align-items: center; }
  #fps { position: fixed; top: 10px; right: 12px; color: #6c6; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
  <div id="board">GAME&nbsp;BOARD</div>
  <div id="stage">
    <div id="wash"></div>
    <div id="swarm"></div>
    <div id="reveal"><div class="title">Evil&nbsp;triumphs</div></div>
  </div>
  <!-- the baked bat lives here once; every bat is a cheap <use> of it -->
  <svg id="symdefs" width="0" height="0" style="position:absolute"></svg>
  <div id="fps"></div>
  <div id="controls">
    <button id="replay">▶ Replay</button>
    <label>Bats <input id="count" type="range" min="8" max="300" value="250"><span id="countVal">250</span></label>
    <label>Pace <input id="pace" type="range" min="0.5" max="2.5" step="0.1" value="1.8"><span id="paceVal">1.8×</span></label>
  </div>

  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <script src="_demo_bat_data.js"></script>
  <script>
    const swarm = document.getElementById('swarm');
    const wash  = document.getElementById('wash');
    const title = document.querySelector('#reveal .title');
    const fpsEl = document.getElementById('fps');
    const EASE  = 'cubic-bezier(.22,.61,.36,1)';
    const FLIGHT_EASE = 'cubic-bezier(.45,.05,.55,.95)';
    const rand  = (a,b) => a + Math.random()*(b-a);
    let batTemplate = null;   // a <div class="bat"> we clone per bat

    // ---- One-time bake: render the Lottie bat at a wings-spread frame,
    //      strip its clip/defs, and stash it as a reusable <symbol>. ----
    function bakeBat() {
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:800px;height:600px';
      document.body.appendChild(host);
      const a = lottie.loadAnimation({ container: host, renderer: 'svg',
        loop: false, autoplay: false, animationData: window.BAT_DATA });
      a.goToAndStop(95, true);                       // widest wingspan
      const src = host.querySelector('svg').cloneNode(true);
      src.querySelectorAll('defs').forEach(d => d.remove());
      src.querySelectorAll('[clip-path]').forEach(el => el.removeAttribute('clip-path'));
      document.getElementById('symdefs').innerHTML =
        '<symbol id="batsym" viewBox="0 0 800 600">' + src.innerHTML + '</symbol>';
      a.destroy(); host.remove();                    // lottie is done — no runtime cost

      batTemplate = document.createElement('div');
      batTemplate.className = 'bat';
      batTemplate.innerHTML = '<svg class="bat-svg" viewBox="0 0 800 600"><use href="#batsym"/></svg>';
    }

    function play() {
      swarm.innerHTML = '';
      const n = +document.getElementById('count').value;
      const pace = +document.getElementById('pace').value;

      wash.getAnimations().forEach(a => a.cancel());
      wash.animate([{opacity:0},{opacity:1}], {duration:900, easing:'ease-out', fill:'both'});

      const R = Math.max(innerWidth, innerHeight) * 0.72;
      const frag = document.createDocumentFragment();
      const flights = [];

      for (let i=0;i<n;i++) {
        const bat = batTemplate.cloneNode(true);
        bat.querySelector('.bat-svg').style.setProperty('--flap', rand(0.20, 0.25).toFixed(3)+'s');
        frag.appendChild(bat);

        const scale = rand(0.35, 1.15);
        const angle = rand(0, Math.PI*2);
        const dist  = R * rand(0.85, 1.25);
        const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
        const tilt = rand(-20, 20);
        const bow  = rand(-0.22, 0.22);
        const mx = dx*0.5 - Math.sin(angle)*dist*bow;
        const my = dy*0.5 + Math.cos(angle)*dist*bow;
        const base = 'translate(-50%,-50%)';
        flights.push([bat, [
          { transform: `${base} translate(0,0) scale(${scale*0.3}) rotate(${tilt}deg)`, opacity: 0 },
          { opacity: 1, offset: 0.08 },
          { transform: `translate(calc(-50% + ${mx}px), calc(-50% + ${my}px)) scale(${scale}) rotate(${tilt}deg)`, offset: 0.5 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scale*1.1}) rotate(${tilt}deg)`, opacity: 1 }
        ], { duration: rand(1900,2900)*pace, delay: rand(0,650)*pace, easing: FLIGHT_EASE, fill: 'both' }]);
      }
      swarm.appendChild(frag);
      flights.forEach(([el,kf,opt]) => el.animate(kf,opt));

      title.getAnimations().forEach(a => a.cancel());
      title.animate(
        [{opacity:0, transform:'scale(1.15)', filter:'blur(6px)'},
         {opacity:1, transform:'scale(1)',    filter:'blur(0px)'}],
        {duration:1500, delay:1200*pace, easing:EASE, fill:'both'});
    }

    document.getElementById('replay').addEventListener('click', play);
    document.getElementById('count').addEventListener('input', e =>
      document.getElementById('countVal').textContent = e.target.value);
    document.getElementById('pace').addEventListener('input', e =>
      document.getElementById('paceVal').textContent = parseFloat(e.target.value).toFixed(1)+'×');

    let last = performance.now(), frames = 0;
    (function loop(t){ frames++; if (t-last>=500){
      fpsEl.textContent = Math.round(frames*1000/(t-last)) + ' fps'; frames=0; last=t; }
      requestAnimationFrame(loop); })(performance.now());

    if (typeof lottie !== 'undefined' && window.BAT_DATA) {
      window.addEventListener('load', () => { bakeBat(); setTimeout(play, 300); });
    } else { fpsEl.textContent = 'lottie/data failed to load'; }
  </script>
</body>
</html>
