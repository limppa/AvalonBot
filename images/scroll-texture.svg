<svg xmlns="http://www.w3.org/2000/svg" width="60" height="100">
  <!--
    Wave lines for scroll quote background texture.
    Tile: 60×100px, repeat-x.
    Each line uses cubic bezier with HORIZONTAL tangents at x=0 and x=60
    so tiling is seamless and the seam with the scroll PNG is clean.
    Alternating phase A (up-first) and phase B (down-first) creates the ≈ pattern.
    Amplitude ≈ 2px. Lines spaced 8px apart starting at y=4.
    Phase A: M 0,y  C 8,y  22,y-5  30,y  C 38,y+5  52,y  60,y
    Phase B: M 0,y  C 8,y  22,y+5  30,y  C 38,y-5  52,y  60,y
  -->
  <!-- Phase A (up-first): y = 4, 20, 36, 52, 68, 84 -->
  <path d="M 0,4  C 8,4  22,-1  30,4  C 38,9  52,4  60,4"  stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <path d="M 0,20 C 8,20 22,15  30,20 C 38,25 52,20 60,20" stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <path d="M 0,36 C 8,36 22,31  30,36 C 38,41 52,36 60,36" stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <path d="M 0,52 C 8,52 22,47  30,52 C 38,57 52,52 60,52" stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <path d="M 0,68 C 8,68 22,63  30,68 C 38,73 52,68 60,68" stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <path d="M 0,84 C 8,84 22,79  30,84 C 38,89 52,84 60,84" stroke="#c09038" stroke-width="0.9" fill="none" opacity="0.45"/>
  <!-- Phase B (down-first): y = 12, 28, 44, 60, 76, 92 -->
  <path d="M 0,12 C 8,12 22,17  30,12 C 38,7  52,12 60,12" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
  <path d="M 0,28 C 8,28 22,33  30,28 C 38,23 52,28 60,28" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
  <path d="M 0,44 C 8,44 22,49  30,44 C 38,39 52,44 60,44" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
  <path d="M 0,60 C 8,60 22,65  30,60 C 38,55 52,60 60,60" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
  <path d="M 0,76 C 8,76 22,81  30,76 C 38,71 52,76 60,76" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
  <path d="M 0,92 C 8,92 22,97  30,92 C 38,87 52,92 60,92" stroke="#b07828" stroke-width="0.9" fill="none" opacity="0.40"/>
</svg>
