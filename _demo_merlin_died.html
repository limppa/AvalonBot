<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merlin Died — effect demo</title>
<style>
  @font-face {
    font-family: 'OptimusPrinceps';
    src: url('fonts/OptimusPrincepsSemiBold.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --death-red: #8a1220;        /* desaturated blood red, DS-style */
    --death-red-glow: #c0392b;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0c;          /* stand-in for your game screen */
    overflow: hidden;
    font-family: 'OptimusPrinceps', 'Times New Roman', serif;
  }

  /* --- a fake "game board" behind the effect, just so you can see the overlay dim it --- */
  #board {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    color: #2a2a33; font-size: 4vw; letter-spacing: .3em;
    user-select: none;
  }

  /* ---------------- THE EFFECT ---------------- */

  /* full-screen darkening layer */
  #death-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,.55) 0%,
                rgba(0,0,0,.85) 70%,
                rgba(0,0,0,.96) 100%);
    display: grid; place-items: center;
    opacity: 0;                    /* animated in via JS */
    pointer-events: none;
  }

  .death-text {
    position: relative;
    text-align: center;
    color: var(--death-red);
    font-size: clamp(2.2rem, 8vw, 7rem);
    letter-spacing: .18em;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(192,57,43,.35),
                 0 0 4px rgba(0,0,0,.9);
    white-space: nowrap;
    /* start slightly zoomed + soft, animated to sharp */
    opacity: 0;
    transform: scale(1.15);
    filter: blur(6px);
  }

  /* the two thin horizontal rules that sweep outward behind the text */
  .death-rule {
    position: absolute;
    top: 50%;
    left: 50%;
    height: 2px;
    width: 0;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg,
                transparent, rgba(138,18,32,.9) 20%,
                rgba(192,57,43,.9) 50%,
                rgba(138,18,32,.9) 80%, transparent);
  }

  /* ---------------- controls (not part of the effect) ---------------- */
  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; align-items: center;
    font-family: system-ui, sans-serif; color: #888;
  }
  #controls button {
    font: inherit; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #333; background: #16161a; color: #ddd; cursor: pointer;
  }
  #controls button:hover { background: #202027; }
  #controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>

  <div id="board">GAME&nbsp;BOARD</div>

  <div id="death-overlay">
    <div class="death-text" id="deathText">
      <span class="death-rule" id="ruleTop"></span>
      Merlin&nbsp;died
      <span class="death-rule" id="ruleBottom" style="top:calc(50% + 1.6em)"></span>
    </div>
  </div>

  <div id="controls">
    <button id="replay">▶ Replay effect</button>
    <label><input type="checkbox" id="wasted"> GTA "WASTED" tint</label>
  </div>

<script>
  const overlay = document.getElementById('death-overlay');
  const text    = document.getElementById('deathText');
  const ruleTop = document.getElementById('ruleTop');
  const ruleBot = document.getElementById('ruleBottom');
  const board   = document.getElementById('board');

  const EASE = 'cubic-bezier(.22,.61,.36,1)';

  function play() {
    // reset
    [overlay, text, ruleTop, ruleBot].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    board.getAnimations().forEach(a => a.cancel());

    const wasted = document.getElementById('wasted').checked;

    // 1. screen darkens
    overlay.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: 900, easing: EASE, fill: 'forwards' }
    );

    // optional: GTA-style desaturate + dim of the board underneath
    if (wasted) {
      board.animate(
        [{ filter: 'grayscale(0) brightness(1)' },
         { filter: 'grayscale(1) brightness(.4)' }],
        { duration: 1200, easing: 'ease-out', fill: 'forwards' }
      );
    } else {
      board.animate([{ filter: 'none' }], { duration: 1, fill: 'forwards' });
    }

    // 2. text resolves from soft+zoomed to sharp
    text.animate(
      [
        { opacity: 0, transform: 'scale(1.15)', filter: 'blur(6px)' },
        { opacity: 1, transform: 'scale(1)',    filter: 'blur(0px)' }
      ],
      { duration: 1400, delay: 250, easing: EASE, fill: 'forwards' }
    );

    // 3. the two rules sweep outward
    const ruleKf = [{ width: '0' }, { width: '150%' }];
    const ruleOpts = { duration: 1100, delay: 350, easing: EASE, fill: 'forwards' };
    ruleTop.animate(ruleKf, ruleOpts);
    ruleBot.animate(ruleKf, ruleOpts);

    // 4. hold, then everything fades out (comment out if you want it to persist)
    const HOLD = 2600;
    text.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 900, delay: HOLD, easing: 'ease-in', fill: 'forwards' });
    overlay.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 1100, delay: HOLD + 200, easing: 'ease-in', fill: 'forwards' });
    if (wasted) board.animate(
      [{ filter: 'grayscale(1) brightness(.4)' }, { filter: 'grayscale(0) brightness(1)' }],
      { duration: 1100, delay: HOLD + 200, easing: 'ease-in', fill: 'forwards' });
  }

  document.getElementById('replay').addEventListener('click', play);
  // autoplay once on load
  window.addEventListener('load', () => setTimeout(play, 400));
</script>
</body>
</html>
