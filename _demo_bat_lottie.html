<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lottie bat — shape check</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: #e9e5ee; transition: background .2s;
  }
  body.dark { background: #0d0a12; }

  #bat { width: 46vmin; height: 34.5vmin; }   /* 800x600 aspect */

  .guide { position: fixed; background: rgba(128,128,128,.35); }
  .guide.h { left: 0; right: 0; top: 50%; height: 1px; }
  .guide.v { top: 0; bottom: 0; left: 50%; width: 1px; }
  body.no-guide .guide { display: none; }

  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: center;
    font-family: system-ui, sans-serif; font-size: 13px; color: #666;
  }
  #controls button {
    font: inherit; padding: 6px 12px; border-radius: 8px;
    border: 1px solid #bbb; background: #f4f2f6; color: #333; cursor: pointer;
  }
  #controls label { display: flex; gap: 6px; align-items: center; }
  #err { position: fixed; top: 12px; left: 12px; color: #b00; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
  <div class="guide h"></div>
  <div class="guide v"></div>
  <div id="bat"></div>
  <div id="err"></div>

  <div id="controls">
    <button id="playpause">⏸ Pause</button>
    <label>speed
      <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1">
      <span id="speedVal">1.0×</span>
    </label>
    <label><input type="checkbox" id="dark"> dark bg</label>
    <label><input type="checkbox" id="guide" checked> center guides</label>
  </div>

  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <script src="_demo_bat_data.js"></script>
  <script>
    const errEl = document.getElementById('err');
    if (typeof lottie === 'undefined') {
      errEl.textContent = 'lottie-web failed to load (need internet for the CDN).';
    } else if (!window.BAT_DATA) {
      errEl.textContent = '_demo_bat_data.js did not load.';
    } else {
      const anim = lottie.loadAnimation({
        container: document.getElementById('bat'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: window.BAT_DATA,
      });

      const btn = document.getElementById('playpause');
      let playing = true;
      btn.addEventListener('click', () => {
        playing = !playing;
        if (playing) { anim.play();  btn.textContent = '⏸ Pause'; }
        else         { anim.pause(); btn.textContent = '▶ Play'; }
      });

      const speed = document.getElementById('speed');
      speed.addEventListener('input', e => {
        anim.setSpeed(+e.target.value);
        document.getElementById('speedVal').textContent =parseFloat(e.target.value).toFixed(1) + '×';
      });
    }

    document.getElementById('dark').addEventListener('change', e =>
      document.body.classList.toggle('dark', e.target.checked));
    document.getElementById('guide').addEventListener('change', e =>
      document.body.classList.toggle('no-guide', !e.target.checked));
  </script>
</body>
</html>
