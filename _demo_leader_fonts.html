<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leader screen — value fonts</title>
<style>
  @font-face { font-family: 'EnchantedLand';      src: url('fonts/Enchanted Land.otf'); }
  @font-face { font-family: 'Franken';            src: url('fonts/CATFranken-Deutsch.ttf'); }
  @font-face { font-family: 'JetBrains Mono';      src: url('fonts/JetBrainsMono-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond';  src: url('fonts/CormorantGaramond-LightItalic.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'Cinzel Decorative';   src: url('fonts/CinzelDecorative-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'OptimusPrinceps';     src: url('fonts/OptimusPrincepsSemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'AnglicanText';        src: url('fonts/AnglicanText.ttf'); }

  :root {
    --cream: #dcc878; --accent: #b87c28; --accent-dim: #5e4818; --accent-brt: #e0a840;
    --stone: #181818; --dim: #5e4818; --evil-txt: #c83838;
  }
  html, body { margin: 0; background: #090c11; color: var(--cream); }
  body {
    min-height: 100vh; padding: 20px 20px 120px;
    display: flex; flex-direction: column; align-items: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .controls {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 14px; align-items: center; justify-content: center;
    background: rgba(4,5,10,0.94); border-bottom: 1px solid #1a1620;
    padding: 12px; font-size: 13px; color: #9a8f70;
  }
  .controls input {
    background: #0c0c10; border: 1px solid var(--stone); color: var(--cream);
    font-family: inherit; font-size: 14px; padding: 6px 10px; width: 220px; text-align: center;
  }
  .controls button {
    background: var(--stone); color: var(--accent); border: 1px solid var(--accent-dim);
    padding: 6px 12px; font-family: inherit; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer; border-radius: 3px;
  }
  .controls button:hover { color: var(--accent-brt); border-color: var(--accent); }

  .intro { max-width: 640px; text-align: center; color: #7a7060; font-size: 13px;
    line-height: 1.6; margin: 78px 0 8px; }

  /* One faithful leader-screen mock per candidate value-font */
  .page { width: min(760px, 94vw); text-align: center; padding: 34px 0 40px; border-bottom: 1px solid #17141c; }
  .font-label {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; color: #8a7f66; margin-bottom: 22px;
  }
  .title {
    font-family: 'Franken', Georgia, serif; font-size: 84px; letter-spacing: 3px; line-height: 1;
    background-image: linear-gradient(180deg, var(--cream), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rule {
    width: 440px; height: 2px; margin: 30px auto;
    background: linear-gradient(to right, rgba(220,200,120,0), rgba(220,200,120,.7) 20%, rgba(220,200,120,.7) 80%, rgba(220,200,120,0));
  }
  .value-wrap { display: inline-block; min-width: 460px; border: 1px solid var(--stone); padding: 14px 40px; }
  .value { font-size: 78px; line-height: 1.15; color: var(--cream); }

  .btns { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .btn {
    width: 460px; padding: 13px 0; background: var(--stone); color: var(--accent);
    border: 1px solid var(--accent-dim); border-radius: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* Candidate fonts for the value only — everything else stays app-standard. */
  .f-cinzel    { font-family: 'Cinzel Decorative', Georgia, serif; }
  .f-optimus   { font-family: 'OptimusPrinceps', Georgia, serif; text-transform: uppercase; letter-spacing: .06em; }
  .f-franken   { font-family: 'Franken', Georgia, serif; }
  .f-enchant   { font-family: 'EnchantedLand', Georgia, serif; }
  .f-cormorant { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
  .f-anglican  { font-family: 'AnglicanText', Georgia, serif; }
  .f-georgia   { font-family: Georgia, serif; }
</style>
</head>
<body>

  <div class="controls">
    <span>value:</span>
    <input id="val" value="Noora" spellcheck="false">
    <button data-v="Noora">name</button>
    <button data-v="Aleksander">long name</button>
    <button data-v="3">number</button>
  </div>

  <div class="intro">
    The randomized first-leader screen — title, buttons and labels stay in the app fonts.<br>
    Only the big <b>name/number</b> changes font below. Type in the box to test any value.
  </div>

  <div id="pages"></div>

<script>
  const FONTS = [
    ['Cinzel Decorative  (current default)', 'f-cinzel'],
    ['OptimusPrinceps', 'f-optimus'],
    ['Franken (CAT)', 'f-franken'],
    ['Enchanted Land', 'f-enchant'],
    ['Cormorant Garamond (italic)', 'f-cormorant'],
    ['AnglicanText (blackletter)', 'f-anglican'],
    ['Georgia (plain baseline)', 'f-georgia'],
  ];

  const pages = document.getElementById('pages');
  FONTS.forEach(([label, cls]) => {
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = `
      <div class="font-label">${label}</div>
      <div class="title">First leader</div>
      <div class="rule"></div>
      <div class="value-wrap"><span class="value ${cls}">Noora</span></div>
      <div class="btns">
        <div class="btn">[SPACE]&nbsp;&nbsp;Randomize leader</div>
        <div class="btn">[P]&nbsp;&nbsp;Add names</div>
        <div class="btn">[ENTER]&nbsp;&nbsp;Continue</div>
      </div>`;
    pages.append(page);
  });

  const val = document.getElementById('val');
  const setAll = v => document.querySelectorAll('.value').forEach(el => el.textContent = v || '—');
  val.addEventListener('input', () => setAll(val.value));
  document.querySelectorAll('.controls button').forEach(b =>
    b.addEventListener('click', () => { val.value = b.dataset.v; setAll(b.dataset.v); }));
</script>
</body>
</html>
