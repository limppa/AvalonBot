<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Single bat — shape check</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: #e9e5ee;                 /* light by default → silhouette reads clearly */
    transition: background .2s;
  }
  body.dark { background: #0d0a12; }      /* how it'll actually sit in-game */

  .bat {
    width: 44vmin; height: 22vmin;
  }
  .bat svg { display: block; width: 100%; height: 100%; transform-origin: center; }
  .bat.flapping svg { animation: flap .35s infinite ease-in-out; }

  .wing, .body, .ear { fill: #0a0810; }
  body.dark .wing, body.dark .body, body.dark .ear { fill: #0a0810; }
  .eye { fill: #ff2436; }

  @keyframes flap {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(.30); }
  }

  /* crosshair through the true center so you can judge symmetry/orientation */
  .guide { position: fixed; background: rgba(128,128,128,.35); }
  .guide.h { left: 0; right: 0; top: 50%; height: 1px; }
  .guide.v { top: 0; bottom: 0; left: 50%; width: 1px; }
  body.no-guide .guide { display: none; }

  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: center;
    font-family: system-ui, sans-serif; font-size: 13px; color: #666;
  }
  #controls label { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body class="">
  <div class="guide h"></div>
  <div class="guide v"></div>

  <div class="bat" id="bat">
    <svg viewBox="-50 -25 100 50" xmlns="http://www.w3.org/2000/svg">
      <path class="wing" d="M0,-2 C -10,-12 -22,-12 -30,-6 C -26,-4 -24,-2 -26,2
        C -34,0 -42,4 -48,12 C -40,7 -32,8 -24,7 C -18,10 -10,8 0,3 Z"/>
      <path class="wing" d="M0,-2 C 10,-12 22,-12 30,-6 C 26,-4 24,-2 26,2
        C 34,0 42,4 48,12 C 40,7 32,8 24,7 C 18,10 10,8 0,3 Z"/>
      <path class="ear" d="M-3,-6 L-4,-13 L-1,-7 Z"/>
      <path class="ear" d="M3,-6 L4,-13 L1,-7 Z"/>
      <ellipse class="body" cx="0" cy="0" rx="4.2" ry="7.5"/>
      <circle class="eye" cx="-2" cy="-3" r="1.15"/>
      <circle class="eye" cx="2"  cy="-3" r="1.15"/>
    </svg>
  </div>

  <div id="controls">
    <label><input type="checkbox" id="flap"> flap</label>
    <label><input type="checkbox" id="dark"> dark bg</label>
    <label><input type="checkbox" id="guide" checked> center guides</label>
  </div>

<script>
  const bat = document.getElementById('bat');
  document.getElementById('flap').addEventListener('change', e =>
    bat.classList.toggle('flapping', e.target.checked));
  document.getElementById('dark').addEventListener('change', e =>
    document.body.classList.toggle('dark', e.target.checked));
  document.getElementById('guide').addEventListener('change', e =>
    document.body.classList.toggle('no-guide', !e.target.checked));
</script>
</body>
</html>
